# Hermes HUD Web UI — Docker Compose for NAS
#
# Image built via GitHub Actions:
#   ghcr.io/denginex/hermes-hudui:latest
#
# On NAS:
#   docker compose up -d
#   Then open http://<nas-ip>:3001

services:
  hermes-hudui:
    image: ghcr.io/denginex/hermes-hudui:latest
    container_name: hermes-hudui
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - HERMES_HOME=/data/.hermes
    volumes:
      # Mount your Hermes agent data directory (read-only)
      # Change the left side to your actual path on NAS host
      - ~/.hermes:/data/.hermes:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
